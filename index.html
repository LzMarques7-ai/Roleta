<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Roleta da Vida V18.1</title>
<link rel="stylesheet" href="style.css?v=18.1.0">
</head>
<body>
<div id="app"></div>
<script>
/* Fallback visível: evita tela branca se algum arquivo do projeto estiver faltando. */
window.addEventListener("error", function(e){
  if (!document.getElementById("rv-runtime-error")) {
    const box=document.createElement("div");
    box.id="rv-runtime-error";
    box.style.cssText="position:fixed;inset:16px;z-index:99999;background:#111;color:#fff;border:1px solid #7d304c;border-radius:18px;padding:20px;font:14px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;overflow:auto";
    box.innerHTML="<b>Roleta da Vida não conseguiu carregar um arquivo.</b><br><br>"+String(e.message||"Erro de JavaScript")+"<br><br><small>Confira se todos os arquivos originais do projeto continuam na mesma pasta.</small>";
    document.body.appendChild(box);
  }
});
</script>

<!-- Ordem oficial do projeto: dependências → visual → aplicação → compatibilidade. -->
<script src="library.js?v=18.1.0"></script>
<script src="engine.js?v=18.1.0"></script>
<script src="story.js?v=18.1.0"></script>
<script src="sources.js?v=18.1.0"></script>
<script src="visual-engine.js?v=18.1.0"></script>
<script src="app.js?v=18.1.0"></script>
<script src="reference-upgrade.js?v=18.1.0"></script>
</body>
</html>
