function finishSpin(key){const x=pick(DB[key]);const chosen={key,name:x[0],tag:x[1],mods:x[2]||{}};state.character.picks.push(chosen);Object.entries(chosen.mods).forEach(([k,v])=>{if(k in state.character.stats)state.character.stats[k]+=v});Object.keys(state.character.stats).forEach(k=>state.character.stats[k]=C(state.character.stats[k]));$("roulette").classList.remove("spinning");$("value").textContent=chosen.name;$("sub").textContent=chosen.tag;$("effect").innerHTML="<b>EFEITOS</b><div class='mods'>"+(Object.entries(chosen.mods).length?Object.entries(chosen.mods).map(([k,v])=>`<span class="mod">${S[k]||k} ${v>0?"+":""}${v}</span>`).join(""):"<span class='mod'>Nenhum modificador direto</span>")+"</div>";$("effect").classList.remove("hidden");$("next").classList.remove("hidden");$("next").textContent=state.index===active().length-1?"👤 CRIAR PERSONAGEM":"PRÓXIMA ROLAGEM →";state.spinning=false;tabs()}
function next(){if(state.spinning)return;if(state.index>=active().length-1)return finish();state.index++;show();scrollTo({top:0,behavior:"smooth"})}
function synergy(c){const n=c.picks.map(x=>x.name),o=[];const add=(l,m)=>{if(o.some(x=>x.label===l))return;Object.entries(m).forEach(([k,v])=>c.stats[k]+=v);o.push({label:l,mods:m})};if(n.includes("Deus")&&n.includes("Manipulação da realidade"))add("Deus + Realidade",{power:10,potential:8});if(n.includes("Vampiro")&&n.includes("Imortalidade"))add("Vampiro + Imortalidade",{power:8,speed:5,potential:8});if(n.includes("Dragão")&&n.includes("Arma divina"))add("Dragão + Arma divina",{strength:6,durability:6,power:10});if(n.includes("Mestre lendário")&&n.includes("Katana"))add("Mestre lendário + Katana",{combat:8,speed:4});if(n.includes("Gênio")&&n.includes("Manipulação da causalidade"))add("Intelecto + Causalidade",{intelligence:7,power:5});if(n.includes("Sorte impossível"))add("Sorte impossível",{potential:5,power:3});return o}
function score(c){return C(Object.values(c.stats).reduce((a,b)=>a+b,0)/8)}
function finish(){const c=state.character;c.synergies=synergy(c);Object.keys(c.stats).forEach(k=>c.stats[k]=C(c.stats[k]));c.score=score(c);const rn=["Auren","Kael","Ren","Nox","Soren","Riven","Orion","Kairo","Aster","Nyra","Lys","Darian","Eryx","Veyra","Akio","Mikael"],sn=["Valen","Voss","Drake","Ardent","Noctis","Raven","Solari","Kane","Astra","Veyne","Kuro","Zenith"];c.name=pick(rn)+" "+pick(sn);c.rarity=c.score>=96?"★★★★★ TRANSCENDENTE":c.score>=90?"★★★★★ LENDÁRIO":c.score>=78?"★★★★☆ ÉPICO":c.score>=62?"★★★☆☆ RARO":c.score>=45?"★★☆☆☆ INCOMUM":"★☆☆☆☆ COMUM";$("game").classList.add("hidden");$("result").classList.remove("hidden");$("name").textContent=c.name;$("subtitle").textContent=`${get("race")} • ${get("title")} • ${get("age")}`;$("rarity").textContent=`${c.rarity} • Índice ${c.score}/100`;$("tags").innerHTML=c.picks.map(x=>`<span class="tag">${x.name}</span>`).join("");$("stats").innerHTML=Object.entries(c.stats).map(([k,v])=>`<div class="stat"><div class="statTop"><span>${S[k]}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join("");$("rows").innerHTML=c.picks.map(x=>`<div class="row"><span>${rounds.find(r=>r[0]===x.key)[1]}</span><b>${x.name}</b></div>`).join("");$("syn").innerHTML=c.synergies.length?c.synergies.map(x=>`<b>✦ ${x.label}</b>`).join("<br>"):"Nenhuma sinergia especial.";$("story").textContent=story(c);scrollTo({top:0,behavior:"smooth"})}
function get(k){return state.character.picks.find(x=>x.key===k)?.name||"desconhecido"}
function story(c){const p=get("yesno")==="Sim"?`despertou ${get("power").toLowerCase()}`:"nunca despertou poderes sobrenaturais";const best=Object.entries(c.stats).sort((a,b)=>b[1]-a[1])[0],worst=Object.entries(c.stats).sort((a,b)=>a[1]-b[1])[0];return `${c.name} nasceu como ${get("race").toLowerCase()} e recebeu o título de ${get("title").toLowerCase()}. Aos ${get("age").split(" — ")[0]}, possuía força e durabilidade em nível ${get("force").toLowerCase()}, velocidade ${get("speed").toLowerCase()} e uma inteligência classificada como ${get("intelligence").toLowerCase()}. Seu nível de combate era ${get("combat").toLowerCase()}. Ao longo de sua existência, ${p}. Sua arma era ${get("weapon").toLowerCase()}, enquanto sua sorte foi ${get("luck").toLowerCase()}. A maior limitação conhecida era ${get("weakness").toLowerCase()}, mas seu potencial foi ${get("potential").toLowerCase()}. No estado atual, ${c.name} apresenta ${S[best[0]].toLowerCase()} como maior atributo (${best[1]}/100) e ${S[worst[0]].toLowerCase()} como maior vulnerabilidade (${worst[1]}/100). Essa combinação determinou uma trajetória de nível ${c.rarity.toLowerCase()}, deixando aberta a possibilidade de uma evolução muito além de sua condição inicial.`}
function reset(){state={index:0,character:{stats:base(),picks:[],synergies:[]},spinning:false};$("result").classList.add("hidden");$("game").classList.remove("hidden");show();scrollTo({top:0,behavior:"smooth"})}
function saved(){try{return JSON.parse(localStorage.getItem("cr_v3")||"[]")}catch(e){return[]}}
function renderSaved(){const a=saved();$("saved").innerHTML=a.length?a.map((c,i)=>`<div class="save" data-i="${i}"><b>${c.name}</b><small>${c.rarity} • ${c.subtitle}</small></div>`).join(""):"<span style='color:#7e8491;font-size:11px'>Nenhum personagem salvo.</span>";document.querySelectorAll(".save").forEach(e=>e.onclick=()=>load(a[+e.dataset.i]))}
function load(c){state.character=c;$("game").classList.add("hidden");$("result").classList.remove("hidden");$("name").textContent=c.name;$("subtitle").textContent=c.subtitle;$("rarity").textContent=`${c.rarity} • Índice ${c.score}/100`;$("tags").innerHTML=c.picks.map(x=>`<span class="tag">${x.name}</span>`).join("");$("stats").innerHTML=Object.entries(c.stats).map(([k,v])=>`<div class="stat"><div class="statTop"><span>${S[k]}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join("");$("rows").innerHTML=c.picks.map(x=>`<div class="row"><span>${rounds.find(r=>r[0]===x.key)?.[1]||x.key}</span><b>${x.name}</b></div>`).join("");$("syn").innerHTML=c.synergies?.length?c.synergies.map(x=>`<b>✦ ${x.label}</b>`).join("<br>"):"Nenhuma.";$("story").textContent=story(c)}
$("spin").onclick=spin;$("next").onclick=next;$("again").onclick=reset;$("save").onclick=()=>{const c=JSON.parse(JSON.stringify(state.character));c.subtitle=$("subtitle").textContent;const a=saved();a.unshift(c);localStorage.setItem("cr_v3",JSON.stringify(a.slice(0,50)));renderSaved();alert("Personagem salvo!")};$("share").onclick=async()=>{const t=`${state.character.name} — ${state.character.rarity}\n${$("subtitle").textContent}\nÍndice: ${state.character.score}/100`;try{navigator.share?await navigator.share({title:"Meu personagem",text:t}):(await navigator.clipboard.writeText(t),alert("Ficha copiada!"))}catch(e){}};show();renderSaved();
</script></body></html>
