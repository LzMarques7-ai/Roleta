<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Character Roulette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:#08090d;color:#f4f5f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit}
.app{width:100%;max-width:760px;margin:auto;padding:16px 14px 60px}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:12px;font-weight:900;letter-spacing:.16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{font-size:10px;color:#9b7cff;border:1px solid #39304e;border-radius:99px;padding:5px 8px}
.hero{text-align:center;padding:30px 5px 22px}
.hero h1{font-size:36px;line-height:1;margin:0 0 9px;letter-spacing:-.05em}
.hero p{margin:0;color:#8f94a1;font-size:14px;line-height:1.45}
.card{background:linear-gradient(145deg,#14161e,#0f1016);border:1px solid #292d38;border-radius:20px;padding:16px;margin:11px 0;box-shadow:0 18px 50px #0005}
.kicker{font-size:10px;color:#888e9c;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
.progress{height:7px;background:#242733;border-radius:20px;overflow:hidden;margin:4px 0 16px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#9b7cff,#5de1ff);transition:width .45s}
.stage{text-align:center;padding:13px 5px 16px}
.stage .number{font-size:10px;color:#8c91a0;letter-spacing:.14em;text-transform:uppercase}
.stage h2{font-size:25px;margin:8px 0 5px}
.stage .hint{font-size:12px;color:#777d8b}
.roulette{position:relative;margin:10px auto 15px;width:min(430px,100%);height:132px;border:1px solid #333745;border-radius:18px;background:#0b0d13;display:flex;align-items:center;justify-content:center;overflow:hidden}
.roulette:before,.roulette:after{content:"";position:absolute;top:0;bottom:0;width:25%;z-index:2;pointer-events:none}
.roulette:before{left:0;background:linear-gradient(90deg,#0b0d13,transparent)}
.roulette:after{right:0;background:linear-gradient(-90deg,#0b0d13,transparent)}
.pointer{position:absolute;top:7px;z-index:4;font-size:13px;color:#9b7cff}
.spin-value{font-size:25px;font-weight:950;letter-spacing:-.03em;z-index:3;padding:0 30px;text-align:center}
.spin-sub{position:absolute;bottom:10px;color:#727887;font-size:10px;z-index:3}
.spin-btn{width:100%;border:0;border-radius:16px;padding:17px;background:linear-gradient(90deg,#9b7cff,#718fff);color:#08090d;font-weight:950;font-size:17px;cursor:pointer}
.spin-btn:disabled{opacity:.55;cursor:default}
.next-btn{width:100%;margin-top:8px;border:1px solid #333744;border-radius:15px;padding:14px;background:#161821;color:#fff;font-weight:850;cursor:pointer}
.effect{margin-top:13px;padding:11px;border:1px solid #2b3040;border-radius:13px;background:#10121a}
.effect strong{font-size:11px}.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.mod{font-size:10px;padding:6px 8px;border-radius:99px;background:#1c202b;color:#cfd3dd}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tab{padding:10px 5px;text-align:center;border:1px solid #292d38;border-radius:11px;background:#10121a;color:#9297a4;font-size:11px}
.tab.on{color:#fff;border-color:#5b4a91}
.hidden{display:none!important}
.result-title{font-size:32px;font-weight:950;letter-spacing:-.05em}
.result-sub{color:#5de1ff;font-size:13px;margin-top:3px}
.rarity{color:#ffd76a;margin-top:10px;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.tag{font-size:10px;padding:7px 9px;border-radius:99px;background:#1b1e27;border:1px solid #303542}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#0c0e14;border:1px solid #222631;border-radius:12px;padding:10px}
.stat-top{display:flex;justify-content:space-between;font-size:11px}.bar{height:6px;background:#282c36;border-radius:10px;margin-top:7px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#9b7cff,#5de1ff)}
.rows{display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px;border-radius:11px;background:#0c0e14;border:1px solid #222631;font-size:12px}.row span{color:#8e94a1}.row b{text-align:right}
.text{font-size:13px;line-height:1.62;color:#d8dbe2}.text b{color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:1px solid #303440;border-radius:12px;background:#14161e;color:#fff;padding:11px;cursor:pointer}
.save{padding:10px 0;border-bottom:1px solid #292d38;cursor:pointer}.save:last-child{border:0}.save b{font-size:12px}.save small{display:block;color:#858b98;font-size:10px;margin-top:3px}
.empty{font-size:11px;color:#7e8491}
@keyframes wobble{0%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}100%{transform:translateX(0)}}
.spinning{animation:wobble .12s linear infinite}
@media(max-width:430px){.hero h1{font-size:31px}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="logo">CHARACTER // ROULETTE</div><div class="ver">V2.0</div></header>

<section class="hero">
<h1>Construa um personagem.</h1>
<p>Uma roleta por vez. Cada resultado altera a ficha.</p>
</section>

<section id="game" class="card">
<div class="kicker">Progresso</div>
<div class="progress"><div id="progress"></div></div>

<div class="stage">
<div class="number" id="roundNumber"></div>
<h2 id="roundTitle"></h2>
<div class="hint" id="roundHint"></div>

<div class="roulette" id="roulette">
<div class="pointer">▼</div>
<div class="spin-value" id="spinValue">?</div>
<div class="spin-sub" id="spinSub">TOQUE PARA GIRAR</div>
</div>

<button class="spin-btn" id="spinBtn">🎰 GIRAR</button>
<button class="next-btn hidden" id="nextBtn">PRÓXIMA ROLAGEM →</button>
<div class="effect hidden" id="effect"></div>
</div>

<div class="tabs" id="miniTabs"></div>
</section>

<section id="result" class="hidden">
<div class="card">
<div class="kicker">Personagem concluído</div>
<div class="result-title" id="resultName"></div>
<div class="result-sub" id="resultSub"></div>
<div class="rarity" id="resultRarity"></div>
<div class="tags" id="resultTags"></div>
</div>

<div class="card"><div class="kicker">Atributos finais</div><div class="stats" id="resultStats"></div></div>

<div class="card"><div class="kicker">Resultados da roleta</div><div class="rows" id="resultRows"></div></div>

<div class="card"><div class="kicker">Sinergias</div><div class="text" id="synergies"></div></div>

<div class="card"><div class="kicker">História</div><div class="text" id="story"></div></div>

<div class="card actions">
<button id="saveBtn">💾 Salvar</button><button id="shareBtn">↗ Compartilhar</button>
</div>

<div class="card"><div class="kicker">Novo personagem</div><button class="spin-btn" id="restartBtn">🎰 COMEÇAR NOVA ROLAGEM</button></div>
</section>

<section class="card">
<div class="kicker">Personagens salvos</div><div id="saved"></div>
</section>
</main>

<script>

/* ==========================================================

   Tudo está dentro deste único index.html.

const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random()*a.length)];
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const clamp = (n,a=1,b=100) => Math.max(a,Math.min(b,Math.round(n)));

const statNames={

/* Cada opção possui efeito estatístico real. */

],

],
power:[

],
body:[

],
luck:[

["Azarado",-12,{luck:-12}],
["Normal",0,{}],
["Sortudo",12,{luck:12}],
["Extremamente sortudo",25,{luck:25}],
["Fortuna absurda",35,{luck:35,potential:5}]
],
difficulty:[
["Vida tranquila",10,{health:5,discipline:3,luck:5}],
["Vida comum",30,{}],
["Vida difícil",55,{resistance:8,wisdom:6,health:-4}],
["Vida brutal",75,{resistance:14,wisdom:10,combat:8,health:-8}],
["Inferno",95,{resistance:20,wisdom:15,combat:12,health:-15,luck:-10}]
],
destiny:[
["Vida comum",{},{}],
["Herói improvável",{potential:10,charisma:5,luck:8},{}],
["Vilão em ascensão",{potential:18,charisma:8,wisdom:-5,luck:2},{}],
["Lenda mundial",{potential:25,charisma:12,luck:12},{}],
["Escolhido",{potential:30,wisdom:10,charisma:8},{}],
["Tragédia anunciada",{potential:8,wisdom:12,resistance:8,luck:-22},{}]
]};

/* Ordem deliberada: resultados anteriores influenciam a ficha,
   mas não precisamos contar história até o fim. */
const rounds=[
["species","ESPÉCIE","De onde esse personagem veio?"],
["origin","ORIGEM","O ambiente que moldou sua vida."],
["personality","PERSONALIDADE","Como sua mente funciona."],
["talent","TALENTO","Aquilo que ele faz naturalmente melhor."],
["energy","SISTEMA DE ENERGIA","Como seu poder é canalizado."],
["power","PODER","A habilidade extraordinária, se houver."],
["body","CONDIÇÃO FÍSICA","Como seu corpo se desenvolveu."],
["luck","SORTE","Quanto o acaso favorece esse personagem."],
["difficulty","DIFICULDADE DA VIDA","O nível de adversidade enfrentado."],
["destiny","DESTINO","A direção provável de sua vida."]
];

let state={
 index:0,
 character:{
  stats:{strength:rand(35,65),speed:rand(35,65),resistance:rand(35,65),
   intelligence:rand(35,65),wisdom:rand(35,65),charisma:rand(35,65),
   discipline:rand(35,65),creativity:rand(35,65),luck:rand(25,75),
   combat:rand(30,65),potential:rand(35,70),health:rand(40,70)},
  picks:[],synergies:[]
 },
 spinning:false
};

function apply(stats,mods){
 for(const [k,v] of Object.entries(mods||{})){
  if(k in stats)stats[k]+=v;
 }
}

function optionFor(key){
 const item=pick(DB[key]);
 return {name:item[0],tag:item[1],mods:item[2]||{}};
}

function effectText(mods){
 const entries=Object.entries(mods||{}).filter(([,v])=>v);
 if(!entries.length)return '<strong>EFEITO:</strong> nenhum modificador direto';
 return '<strong>EFEITOS:</strong><div class="mods">'+entries.map(([k,v])=>
  `<span class="mod">${statNames[k]} ${v>0?"+":""}${v}</span>`).join("")+'</div>';
}

function updateProgress(){
 $("progress").style.width=(state.index/rounds.length*100)+"%";
}

function showRound(){
 const [key,title,hint]=rounds[state.index];
 $("roundNumber").textContent=`GIRO ${state.index+1} / ${rounds.length}`;
 $("roundTitle").textContent=title;
 $("roundHint").textContent=hint;
 $("spinValue").textContent="?";
 $("spinSub").textContent="TOQUE PARA GIRAR";
 $("spinBtn").disabled=false;
 $("spinBtn").textContent="🎰 GIRAR";
 $("nextBtn").classList.add("hidden");
 $("effect").classList.add("hidden");
 updateProgress();

 document.querySelectorAll(".tab").forEach((el,i)=>{
  el.classList.toggle("on",i<state.index);
 });
}

function spin(){
 if(state.spinning)return;
 state.spinning=true;
 $("spinBtn").disabled=true;
 $("roulette").classList.add("spinning");

 const [key]=rounds[state.index];
 const options=DB[key];
 let ticks=0;
 const total=18+Math.floor(Math.random()*10);

 const timer=setInterval(()=>{
  $("spinValue").textContent=options[Math.floor(Math.random()*options.length)][0];
  ticks++;
  if(ticks>=total){
   clearInterval(timer);
   finishSpin(key);
  }
 },70);
}

function finishSpin(key){
 const chosen=optionFor(key);
 state.character.picks.push({key,...chosen});
 apply(state.character.stats,chosen.mods);

 /* Pequenas sinergias surgem somente da combinação, não de narrativa. */
 calculateSynergy();

 for(const k of Object.keys(state.character.stats)){
  state.character.stats[k]=clamp(state.character.stats[k]);
 }

 $("roulette").classList.remove("spinning");
 $("spinValue").textContent=chosen.name;
 $("spinSub").textContent=chosen.tag||"RESULTADO";
 $("effect").innerHTML=effectText(chosen.mods);
 $("effect").classList.remove("hidden");
 $("nextBtn").classList.remove("hidden");

 if(state.index===rounds.length-1){
  $("nextBtn").textContent="👤 GERAR PERSONAGEM FINAL";
 }else{
  $("nextBtn").textContent="PRÓXIMA ROLAGEM →";
 }

 state.spinning=false;
}

function calculateSynergy(){
 const c=state.character;
 const names=c.picks.map(x=>x.name);
 const add=(label,mods)=>{
  if(c.synergies.some(x=>x.label===label))return;
  apply(c.stats,mods);
  c.synergies.push({label,mods});
 };

 if(names.includes("Orc")&&names.includes("Clã guerreiro"))
  add("Orc + Clã guerreiro",{strength:8,combat:10,resistance:6});

 if(names.includes("Elfo")&&names.includes("Mana"))
  add("Elfo + Mana",{intelligence:7,creativity:7,potential:8});

 if(names.includes("Vampiro")&&names.includes("Energia demoníaca"))
  add("Vampiro + Energia demoníaca",{potential:10,speed:5,combat:5});

 if(names.includes("Gênio")&&names.includes("Mente analítica"))
  add("Gênio + Mente analítica",{intelligence:8,creativity:5,potential:5});

 if(names.includes("Espadachim prodígio")&&names.includes("Ki"))
  add("Espadachim + Ki",{combat:8,discipline:6,speed:4});

 if(names.includes("Manipulação temporal")&&names.includes("Mente analítica"))
  add("Tempo + Mente analítica",{intelligence:8,wisdom:8,potential:8});

 if(names.includes("Manipulação temporal")&&names.includes("Nenhum sistema"))
  add("Tempo sem sistema de energia",{potential:-8,discipline:-5});

 if(names.includes("Impulsivo")&&names.includes("Manipulação temporal"))
  add("Impulsividade + Tempo",{combat:5,discipline:-8});

 if(names.includes("Tragédia anunciada"))
  add("Destino trágico",{wisdom:5,resistance:5});

 if(names.includes("Lenda mundial")||names.includes("Escolhido"))
  add("Destino excepcional",{charisma:5,potential:6});
}

function next(){
 if(state.spinning)return;
 if(state.index>=rounds.length-1){
  finishCharacter();
  return;
 }
 state.index++;
 showRound();
 window.scrollTo({top:0,behavior:"smooth"});
}

function derived(c){
 const s=c.stats;
 const avg=Object.values(s).reduce((a,b)=>a+b,0)/Object.keys(s).length;
 const powerPick=c.picks.find(x=>x.key==="power");
 const powerLevel={
  "Nenhum poder":0,"Superforça":55,"Supervelocidade":70,"Regeneração":80,
  "Telecinese":86,"Telepatia":84,"Pirocinese":72,"Manipulação de gelo":70,
  "Manipulação de sombras":87,"Ilusão":78,"Teletransporte":91,
  "Intangibilidade":90,"Manipulação gravitacional":94,"Manipulação espacial":97,
  "Manipulação temporal":99,"Controle de matéria":98,"Cópia de habilidades":95,
  "Invocação":82,"Absorção de energia":89
 }[powerPick?.name]||0;
 return{
  overall:clamp(avg*.72+powerLevel*.13+s.potential*.1+s.luck*.05),
  power:clamp(powerLevel*.65+s.potential*.35),
  social:clamp(s.charisma*.45+s.wisdom*.2+s.intelligence*.15+s.discipline*.1+s.luck*.1),
  survival:clamp(s.health*.3+s.resistance*.3+s.wisdom*.15+s.speed*.1+s.luck*.15)
 };
}

function getPick(key){return state.character.picks.find(x=>x.key===key)}

function makeStory(c,d,name){
 const species=getPick("species")?.name||"humano";
 const origin=getPick("origin")?.name||"origem desconhecida";
 const personality=getPick("personality")?.name||"personalidade indefinida";
 const talent=getPick("talent")?.name||"talento comum";
 const energy=getPick("energy")?.name||"nenhum sistema";
 const power=getPick("power")?.name||"nenhum poder";
 const body=getPick("body")?.name||"corpo normal";
 const difficulty=getPick("difficulty")?.name||"vida comum";
 const destiny=getPick("destiny")?.name||"vida comum";

 let opening=`${name} nasceu como ${species.toLowerCase()}, em uma ${origin.toLowerCase()}. `;
 let mind=`Desde cedo, sua personalidade ${personality.toLowerCase()} moldou suas decisões. `;
 let gift=`Seu talento natural para ${talent.toLowerCase()} chamou atenção, enquanto seu corpo ${body.toLowerCase()} determinou a forma como enfrentava o mundo. `;
 let powerText=power==="Nenhum poder"
  ? `Apesar de não possuir um poder sobrenatural conhecido, ${name} desenvolveu suas capacidades por meio de ${energy.toLowerCase()}. `
  : `${name} despertou ${power.toLowerCase()}, canalizado através de ${energy.toLowerCase()}. `;
 let struggle=`Sua trajetória foi marcada por ${difficulty.toLowerCase()}, obrigando-o a transformar suas limitações em experiência. `;
 let ending=`Com um índice geral de ${d.overall}/100 e potencial de ${c.stats.potential}/100, seu destino aponta para ${destiny.toLowerCase()}. `;

 const best=Object.entries(c.stats).sort((a,b)=>b[1]-a[1])[0];
 const worst=Object.entries(c.stats).sort((a,b)=>a[1]-b[1])[0];

 return opening+mind+gift+powerText+struggle+
  `Ao longo dos anos, ${name} se tornou especialmente conhecido por ${statNames[best[0]].toLowerCase()}, alcançando ${best[1]}/100 nesse atributo. `+
  `Sua maior vulnerabilidade permaneceu sendo ${statNames[worst[0]].toLowerCase()}, com ${worst[1]}/100. `+
  ending+
  `O que acontecerá depois dependerá das escolhas que fizer, mas as condições desta ficha já definiram uma trajetória muito diferente de uma vida comum.`;
}

function finishCharacter(){
 const c=state.character;
 const d=derived(c);
 const first=["Kael","Auren","Nox","Darian","Riven","Aster","Ren","Kairo","Lys","Orion","Nyra","Soren"];
 const last=["Valen","Drake","Noctis","Ardent","Kane","Solari","Voss","Raven"];
 const name=pick(first)+" "+pick(last);

 const rarity=d.overall>=90?"★★★★★ LENDÁRIO":d.overall>=78?"★★★★☆ ÉPICO":d.overall>=62?"★★★☆☆ RARO":d.overall>=45?"★★☆☆☆ INCOMUM":"★☆☆☆☆ COMUM";

 c.derived=d;c.name=name;c.rarity=rarity;

 $("game").classList.add("hidden");
 $("result").classList.remove("hidden");

 $("resultName").textContent=name;
 $("resultSub").textContent=`${getPick("species").name} • ${getPick("power").name} • ${getPick("destiny").name}`;
 $("resultRarity").textContent=`${rarity}  •  Índice geral ${d.overall}/100`;

 const tags=c.picks.map(x=>x.name);
 $("resultTags").innerHTML=tags.map(x=>`<span class="tag">${x}</span>`).join("");

 $("resultStats").innerHTML=Object.entries(c.stats).map(([k,v])=>
 `<div class="stat"><div class="stat-top"><span>${statNames[k]}</span><b>${v}</b></div><div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`).join("");

 $("resultRows").innerHTML=c.picks.map(x=>
 `<div class="row"><span>${rounds.find(r=>r[0]===x.key)[1]}</span><b>${x.name}</b></div>`).join("");

 $("synergies").innerHTML=c.synergies.length
  ? c.synergies.map(x=>`<b>✦ ${x.label}</b><br>`+Object.entries(x.mods).map(([k,v])=>`${statNames[k]} ${v>0?"+":""}${v}`).join(" • ")).join("<br><br>")
  : "Nenhuma sinergia especial foi ativada. O personagem é definido principalmente pelos resultados individuais.";

 $("story").textContent=makeStory(c,d,name);

 window.scrollTo({top:0,behavior:"smooth"});
}

function reset(){
 state={
  index:0,
  character:{
   stats:{strength:rand(35,65),speed:rand(35,65),resistance:rand(35,65),
    intelligence:rand(35,65),wisdom:rand(35,65),charisma:rand(35,65),
    discipline:rand(35,65),creativity:rand(35,65),luck:rand(25,75),
    combat:rand(30,65),potential:rand(35,70),health:rand(40,70)},
   picks:[],synergies:[]
  },
  spinning:false
 };
 $("result").classList.add("hidden");
 $("game").classList.remove("hidden");
 showRound();
 window.scrollTo({top:0,behavior:"smooth"});
}

function saved(){
 try{return JSON.parse(localStorage.getItem("character_roulette_v2")||"[]")}catch(e){return[]}
}
function renderSaved(){
 const list=saved();
 $("saved").innerHTML=list.length?list.map((c,i)=>
 `<div class="save" data-i="${i}"><b>${c.name}</b><small>${c.rarity} • ${c.resultSub}</small></div>`).join("")
 :'<div class="empty">Nenhum personagem salvo.</div>';

 document.querySelectorAll(".save").forEach(el=>el.onclick=()=>{
  const c=list[Number(el.dataset.i)];
  loadSaved(c);
 });
}
function saveCurrent(){
 if(!state.character.derived){alert("Gere o personagem primeiro.");return}
 const list=saved();
 const c=JSON.parse(JSON.stringify(state.character));
 c.resultSub=$("resultSub").textContent;
 list.unshift(c);
 localStorage.setItem("character_roulette_v2",JSON.stringify(list.slice(0,30)));
 renderSaved();
 alert("Personagem salvo!");
}
function loadSaved(c){
 state.character=c;
 $("game").classList.add("hidden");
 $("result").classList.remove("hidden");
 $("resultName").textContent=c.name;
 $("resultSub").textContent=c.resultSub||"Personagem salvo";
 $("resultRarity").textContent=c.rarity||"";
 $("resultTags").innerHTML=c.picks.map(x=>`<span class="tag">${x.name}</span>`).join("");
 $("resultStats").innerHTML=Object.entries(c.stats).map(([k,v])=>
 `<div class="stat"><div class="stat-top"><span>${statNames[k]}</span><b>${v}</b></div><div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`).join("");
 $("resultRows").innerHTML=c.picks.map(x=>
 `<div class="row"><span>${rounds.find(r=>r[0]===x.key)[1]}</span><b>${x.name}</b></div>`).join("");
 $("synergies").innerHTML=c.synergies?.length?c.synergies.map(x=>`<b>✦ ${x.label}</b>`).join("<br>"):"Nenhuma.";
 $("story").textContent=makeStory(c,c.derived,c.name);
 window.scrollTo({top:0,behavior:"smooth"});
}

async function share(){
 if(!state.character.derived){alert("Gere o personagem primeiro.");return}
 const c=state.character;
 const text=`${c.name} — ${c.rarity}
${$("resultSub").textContent}
Índice geral: ${c.derived.overall}/100
Poder: ${c.derived.power}/100`;
 try{
  if(navigator.share)await navigator.share({title:"Meu personagem",text});
  else{await navigator.clipboard.writeText(text);alert("Ficha copiada!")}
 }catch(e){}
}

$("spinBtn").onclick=spin;
$("nextBtn").onclick=next;
$("restartBtn").onclick=reset;
$("saveBtn").onclick=saveCurrent;
$("shareBtn").onclick=share;

$("miniTabs").innerHTML=rounds.map((r,i)=>`<div class="tab ${i===0?"on":""}">${i+1}</div>`).join("");
showRound();
renderSaved();
</script>
</body>
